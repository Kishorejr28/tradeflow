<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="11" fill="#060f0c"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="10.5" stroke="url(#g1)" stroke-opacity="0.4"/>
  <!-- Bearish candle left -->
  <line x1="11" y1="7"  x2="11" y2="13" stroke="#f87171" stroke-width="1.3" stroke-linecap="round"/>
  <rect x="8.5" y="13" width="5" height="9" rx="1.2" fill="#ef4444" opacity="0.85"/>
  <line x1="11" y1="22" x2="11" y2="28" stroke="#f87171" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Bullish candle centre (tallest) -->
  <line x1="24" y1="9"  x2="24" y2="15" stroke="url(#g1)" stroke-width="1.4" stroke-linecap="round"/>
  <rect x="20.5" y="15" width="7" height="17" rx="1.8" fill="url(#g1)"/>
  <line x1="24" y1="32" x2="24" y2="40" stroke="url(#g1)" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Bullish candle right -->
  <line x1="37" y1="13" x2="37" y2="18" stroke="#34d399" stroke-width="1.3" stroke-linecap="round"/>
  <rect x="34.5" y="18" width="5" height="11" rx="1.2" fill="#10b981" opacity="0.8"/>
  <line x1="37" y1="29" x2="37" y2="36" stroke="#34d399" stroke-width="1.3" stroke-linecap="round"/>
  <!-- TF text at bottom -->
  <text x="24" y="46.5" text-anchor="middle"
    font-family="Arial Black, Arial, sans-serif"
    font-size="6.5" font-weight="900" letter-spacing="1"
    fill="url(#g1)" opacity="0.9">TF</text>
</svg>
